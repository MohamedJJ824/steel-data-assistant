# Full stack. `docker compose up -d` brings up db, api, ui and mlflow.
#
# macOS note: Docker has no Metal access, so Ollama runs natively on the host
# and containers reach it at host.docker.internal. On Linux with a GPU, use
# `--profile local-llm` to run Ollama as a service instead.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sda-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-steel}
      ASSISTANT_RO_PASSWORD: ${ASSISTANT_RO_PASSWORD:?ASSISTANT_RO_PASSWORD is required}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?APP_RW_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-steel}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sda-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ASSISTANT_RO_PASSWORD: ${ASSISTANT_RO_PASSWORD}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Inside the network the database answers on its service name and the
      # container port, not the host mapping.
      SDA_DB__HOST: db
      SDA_DB__PORT: 5432
      SDA_DB__NAME: ${POSTGRES_DB:-steel}
      SDA_API__KEY: ${SDA_API__KEY:?SDA_API__KEY is required}
      SDA_LLM__BACKEND: ${SDA_LLM__BACKEND:-ollama}
      SDA_LLM__BASE_URL: ${SDA_LLM__BASE_URL:-http://host.docker.internal:11434}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Embedding and reranker weights survive a rebuild.
      - models:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: sda-ui
    depends_on:
      - api
    environment:
      SDA_API_URL: http://api:8000
      SDA_API__KEY: ${SDA_API__KEY:?SDA_API__KEY is required}
    ports:
      - "${UI_PORT:-8501}:8501"
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: sda-mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow:/mlflow
    restart: unless-stopped

  # Optional: only started with `docker compose --profile local-llm up`.
  # On macOS prefer a native Ollama; a container here has no Metal access.
  ollama:
    image: ollama/ollama:latest
    container_name: sda-ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  models:
  mlflow:
  ollama:
